services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: organization
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d organization"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - venue_photos:/app/wwwroot/uploads
    environment:
      Jwt__SigningKey: ${Jwt__SigningKey}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=organization;Username=appuser;Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  venue_photos: